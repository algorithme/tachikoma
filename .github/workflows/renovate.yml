name: Renovate

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.11
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
        with:
          # Repository policy is discovered from renovate.json5 automatically.
          # Avoid also loading it as global configuration, which duplicates rules.
          # Add RENOVATE_TOKEN under Settings > Secrets and variables > Actions.
          # Classic PAT scopes: repo, workflow.
          # Fine-grained PAT: Contents, Pull requests, Issues, and Workflows R/W;
          # Commit statuses R/O (needed to evaluate CI for automerge).
          # An appropriately permissioned GitHub App token is also supported.
          token: ${{ secrets.RENOVATE_TOKEN }}
