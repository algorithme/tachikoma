[package]
name = "tachikoma-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
