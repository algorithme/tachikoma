[package]
name = "tachikoma-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
base64 = "0.23"
httpdate = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
jsonschema = { version = "0.58.5", default-features = false }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
